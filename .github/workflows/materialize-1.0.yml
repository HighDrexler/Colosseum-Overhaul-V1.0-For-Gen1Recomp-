name: Materialize Colosseum Overhaul 1.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.release/release_git_blobs.tsv.gz.b64'
      - '.github/workflows/materialize-1.0.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and validate release manifest
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .release/release_git_blobs.tsv.gz.b64 | gzip -dc > "$RUNNER_TEMP/release_git_blobs.tsv"
          lines="$(wc -l < "$RUNNER_TEMP/release_git_blobs.tsv")"
          if [ "$lines" -ne 1074 ]; then
            echo "Expected 1074 release files, decoded $lines" >&2
            exit 1
          fi
          awk -F '\t' '
            NF != 3 { exit 1 }
            $1 !~ /^[0-9a-f]{40}$/ { exit 1 }
            $2 !~ /^[0-9]+$/ { exit 1 }
            $3 ~ /^\// || $3 ~ /(^|\/)\.\.($|\/)/ { exit 1 }
          ' "$RUNNER_TEMP/release_git_blobs.tsv"

      - name: Clone known Colosseum source histories
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sources"
          git clone --mirror https://github.com/HighDrexler/Colosseum-Battle-Environments-1.0-BETA.git "$RUNNER_TEMP/sources/cbe.git"
          git clone --mirror https://github.com/HighDrexler/Colosseum-Inspired-UI-Overhaul-V.1.0.0.git "$RUNNER_TEMP/sources/ui.git"
          git clone --mirror https://github.com/HighDrexler/Colosseum-inspired-Crystal-custom-cart.git "$RUNNER_TEMP/sources/cart.git"

      - name: Reconstruct every exact blob already present in project history
        shell: bash
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/release_git_blobs.tsv"
          out="$RUNNER_TEMP/release-tree"
          unmatched="$RUNNER_TEMP/unmatched.tsv"
          : > "$unmatched"
          mkdir -p "$out"
          matched=0
          total=0
          while IFS=$'\t' read -r sha size path; do
            total=$((total + 1))
            found=''
            for repo in "$RUNNER_TEMP/sources/cbe.git" "$RUNNER_TEMP/sources/ui.git" "$RUNNER_TEMP/sources/cart.git"; do
              if git --git-dir="$repo" cat-file -e "$sha^{blob}" 2>/dev/null; then
                found="$repo"
                break
              fi
            done
            if [ -n "$found" ]; then
              mkdir -p "$out/$(dirname "$path")"
              git --git-dir="$found" cat-file blob "$sha" > "$out/$path"
              actual_size="$(wc -c < "$out/$path")"
              actual_sha="$(git hash-object "$out/$path")"
              if [ "$actual_sha" != "$sha" ] || [ "$actual_size" != "$size" ]; then
                echo "Identity check failed: $path" >&2
                exit 1
              fi
              matched=$((matched + 1))
            else
              printf '%s\t%s\t%s\n' "$sha" "$size" "$path" >> "$unmatched"
            fi
          done < "$manifest"
          missing="$(wc -l < "$unmatched")"
          {
            echo '# Colosseum Overhaul 1.0 materialization status'
            echo
            echo "Expected files: $total"
            echo "Recovered byte-identically from existing HighDrexler Git history: $matched"
            echo "Still requiring exact release payload: $missing"
            echo
            echo 'The staging branch is intentionally incomplete until the missing blob count reaches zero.'
          } > "$out/MATERIALIZATION_STATUS.md"
          cp "$unmatched" "$out/UNMATCHED_BLOBS.tsv"
          echo "MATCHED=$matched" >> "$GITHUB_ENV"
          echo "MISSING=$missing" >> "$GITHUB_ENV"

      - name: Publish release/1.0-staging branch
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/release-tree"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --orphan release/1.0-staging
          git rm -rf . >/dev/null 2>&1 || true
          cp -a "$out/." .
          git add -A
          git commit -m "Stage exact Colosseum Overhaul 1.0 blobs from project history"
          git push --force origin HEAD:release/1.0-staging
          echo "Recovered $MATCHED files; $MISSING still missing."
